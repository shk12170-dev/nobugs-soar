version: 2
# 같은 파일(ci.yml)을 고치는 PR이 여러 개로 나뉘면 하나를 머지한 뒤 나머지가 충돌한다(2026-11-11 #5~#7에서 실제로 겪음).
# 생태계마다 한 PR로 묶고, 메이저 업데이트는 따로 받아 하나씩 확인한다.
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      pip-minor-patch: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      npm-minor-patch: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /infra/wazuh/agent
    schedule: {interval: weekly}
