# 관제 스택(Graylog + OpenSearch + MongoDB). 모든 포트는 127.0.0.1에만 연다.
# 실행: docker compose -f infra/docker-compose.yml --env-file .env up -d   (.env는 tools: python -m nobugs_tools.make_env)
# 버전 고정 이유: Graylog 6.1은 OpenSearch 2.15에서 색인 오류가 나서 2.5.0에 맞춰 검증했다.
name: nobugs-soc

services:
  mongodb:
    image: mongo:6.0.28
    mem_limit: 512m
    environment: { TZ: Asia/Seoul }
    volumes: [mongo_data:/data/db]
    networks: [soc]
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    mem_limit: 2g
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      action.auto_create_index: "false"
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${NB_OPENSEARCH_PASSWORD:?make_env로 .env를 먼저 만드세요}
      TZ: Asia/Seoul
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [os_data:/usr/share/opensearch/data]
    networks: [soc]
    restart: unless-stopped

  graylog:
    image: graylog/graylog:6.1.16
    mem_limit: 2g
    depends_on: [mongodb, opensearch]
    environment:
      GRAYLOG_PASSWORD_SECRET: ${NB_GRAYLOG_SECRET:?make_env로 .env를 먼저 만드세요}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${NB_GRAYLOG_ROOT_SHA2:?make_env로 .env를 먼저 만드세요}
      GRAYLOG_HTTP_EXTERNAL_URI: http://127.0.0.1:9100/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_ROOT_TIMEZONE: Asia/Seoul
      GRAYLOG_SERVER_JAVA_OPTS: "-Xms1g -Xmx1g"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:9100:9000"            # 웹 화면·API
      - "127.0.0.1:12301:12201/udp"      # 포털 이벤트(GELF)
      - "127.0.0.1:12301:12201/tcp"      # 포털 이벤트(GELF) + pfSense 중계기가 GELF로 넣는 경로
      # pfSense 방화벽 로그(syslog)는 별도 포트를 열지 않는다. Docker Desktop(WSL2)은 UDP 게시 포트 전달이
      # 불안정해(외부·루프백 모두 실측으로 드롭 확인) syslog를 직접 받지 못한다. 대신 호스트에서 도는
      # nobugs_tools.syslog_relay가 VMnet 주소(NB_SYSLOG_BIND:1514)로 받아 위 GELF TCP(12301)로 넣는다.
    volumes: [graylog_data:/usr/share/graylog/data]
    networks: [soc]
    restart: unless-stopped

  # S7(홈페이지 변조) 탐지. 인덱서·대시보드는 쓰지 않는다 — 알림은 알림 로그 파일을 nobugs_tools.wazuh_bridge가
  # 직접 읽어 Graylog로 넘긴다(이 저장소의 상관분석·대응은 Graylog 집계 + 엔진 웹훅 경로로 하나로 통일한다).
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    mem_limit: 1g
    environment: { TZ: Asia/Seoul }
    ports:
      - "127.0.0.1:1514:1514/tcp"      # 에이전트 이벤트
      - "127.0.0.1:1515:1515/tcp"      # 에이전트 등록(authd)
    volumes:
      - wazuh_etc:/var/ossec/etc
      - ./wazuh/logs:/var/ossec/logs   # 호스트에서 alerts.json을 읽기 위한 바인드 마운트(브리지 도구용)
    networks: [soc]
    restart: unless-stopped

  wazuh-agent:
    build: ./wazuh/agent
    mem_limit: 256m
    depends_on: [wazuh-manager]
    environment:
      WAZUH_MANAGER: wazuh-manager
      NB_WEB_ROOT: /nobugs/web-root
      NB_AGENT_NAME: nobugs-portal
    volumes:
      - ../web/dist:/nobugs/web-root    # 포털이 실제로 서빙하는 폴더(S7 감시 대상)
      - wazuh_agent_etc:/var/ossec/etc
    networks: [soc]
    restart: unless-stopped

  # S1 알림을 n8n이 먼저 받아 엔진 웹훅으로 넘기고(이미 검증된 티켓·차단 로직을 그대로 쓴다) Discord 알림도
  # n8n에서 직접 보낸다 — 강사 과제의 "탐지 → n8n 자동 대응" 흐름을 보여주는 용도.
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.7   # 실측에 쓴 버전으로 고정(latest는 재현이 깨진다)
    mem_limit: 1536m    # n8n은 Node 힙이 512m에서 OOM-crash(실제로 겪음) - 여유 있게 잡는다
    environment:
      TZ: Asia/Seoul
      N8N_PROTOCOL: http
      N8N_HOST: n8n
      N8N_PORT: "5678"
      WEBHOOK_URL: http://n8n:5678/
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${NB_N8N_USER:?make_env로 .env를 먼저 만드세요}
      N8N_BASIC_AUTH_PASSWORD: ${NB_N8N_PASSWORD:?make_env로 .env를 먼저 만드세요}
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes: [n8n_data:/home/node/.n8n]
    networks: [soc]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

networks:
  soc:
    name: nobugs-soc-net

volumes:
  mongo_data:
  os_data:
  graylog_data:
  wazuh_etc:
  wazuh_agent_etc:
  n8n_data:
